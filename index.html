<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高校教师工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">师</div>
      <div class="brand-text">
        <div class="brand-name">教师工作台</div>
        <div class="brand-sub" id="brandTerm">未设置学期</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div id="sidebar-guide">
      <button class="btn btn-light btn-block" data-action="guide">使用说明</button>
    </div>
    <div id="sidebar-info"></div>
    <div class="sidebar-foot">
      <button class="btn btn-light btn-block" data-action="backup">导出数据备份</button>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div id="topbar-title">仪表盘</div>
      <div id="topbar-info"></div>
      <div id="topbar-actions">
        <button class="btn" data-action="quick-add" title="六类高频录入入口，30 秒内完成">＋ 快速录入</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/settings.js"></script>
<script src="js/courses.js"></script>
<script src="js/students.js"></script>
<script src="js/competitions.js"></script>
<script src="js/projects.js"></script>
<script src="js/guide.js"></script>
<script src="js/summary.js"></script>
<script src="js/main.js"></script>
</body>
</html>
